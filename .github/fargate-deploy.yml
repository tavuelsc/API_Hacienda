name: Fargate Deploy

on:
  push:
    branches: [sync, develop, master]

jobs:
  build-and-deploy:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: "true"

      - name: Fetch environment variables from Parameter Store
        id: fetch-params
        uses: aws-actions/aws-ssm-get-parameter@v1
        with:
          names: |
            DB_HOST
            DB_NAME
            DB_PASS
            DB_USER
            CRYPTO_KEY
          with-decryption: true

      - name: Map variables to php-apache.env
        run: |
          echo "DB_HOST=${{ steps.fetch-params.outputs.DB_HOST }}" >> docker-php-apache/ecr.env
          echo "DB_NAME=${{ steps.fetch-params.outputs.DB_NAME }}" >> docker-php-apache/ecr.env
          echo "DB_USER=${{ steps.fetch-params.outputs.DB_USER }}" >> docker-php-apache/ecr.env
          echo "DB_PASSWORD=${{ steps.fetch-params.outputs.DB_PASS }}" >> docker-php-apache/ecr.env
          echo "CRYPTO_KEY=${{ steps.fetch-params.outputs.CRYPTO_KEY }}" >> docker-php-apache/ecr.env

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
          REPOSITORY: hacienda
        run: |
          # Build a docker container and
          # push it to ECR so that it can be deployed to ECS.
          docker build -f docker-php-apache/ecr.Dockerfile -t $ECR_REGISTRY/$REPOSITORY:$BRANCH_TAG_$IMAGE_TAG .
          docker push $ECR_REGISTRY/$REPOSITORY:$BRANCH_TAG_$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$REPOSITORY:$BRANCH_TAG_$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: hacienda-task-definition.json
          container-name: hacienda
          image: ${{ steps.build-image.outputs.image }}
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: hacienda-service
          cluster: BopCluster
          wait-for-service-stability: true
